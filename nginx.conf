events {
    worker_connections 1024;
}

http {
    upstream websocket_server {
        server 35.209.212.254:80;  # Your WebSocket server address
    }

    server {
        listen 443 ssl;
        server_name your-domain.com;  # Replace with your domain

        # SSL configuration
        ssl_certificate /path/to/your/fullchain.pem;     # Replace with your SSL certificate path
        ssl_certificate_key /path/to/your/privkey.pem;   # Replace with your SSL private key path
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        # WebSocket endpoint
        location /ws/ {
            proxy_pass http://websocket_server;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # WebSocket specific settings
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # Regular HTTP endpoints
        location / {
            proxy_pass http://websocket_server;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
} 